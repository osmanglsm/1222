name: Daily 2D explainer draft
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Fetch topics for review
        run: python scripts/rss_topics.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Render low-resolution silent test
        run: python scripts/render.py --preview --output output/preview/voyager.mp4
      - name: Render narrated full-resolution draft
        run: python scripts/render.py --voice --output output/final/voyager.mp4
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-explainer-draft
          path: output/
          retention-days: 7

