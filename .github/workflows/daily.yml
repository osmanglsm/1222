name: Daily 2D explainer draft
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *' # Türkiye saati 10:17
permissions:
  contents: read
jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Fetch topics for review
        run: python scripts/rss_topics.py
      - name: Render reference-style demo
        run: python scripts/render.py --voice --duration 60 --output output/daily_draft.mp4
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: daily-explainer-draft
          path: output/
          retention-days: 7
